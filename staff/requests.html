<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistance Calls | Maa Hata Randha Staff</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand">
                    <i class="fa-solid fa-utensils"></i>
                    Maa Hata<span>Randha</span>
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="orders.html" class="sidebar-link">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Manage Orders</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="tables.html" class="sidebar-link">
                        <i class="fa-solid fa-chair"></i>
                        <span>Floor Layout</span>
                    </a>
                </li>
                <li class="sidebar-item active">
                    <a href="requests.html" class="sidebar-link">
                        <i class="fa-solid fa-bell"></i>
                        <span>Assistance Calls</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="sidebar-link">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <h3>Assistance Request Queue</h3>
                <div class="user-profile">
                    <div class="user-avatar" id="avatar-circle">S</div>
                    <div class="user-info">
                        <div class="user-name" id="navbar-username">Loading...</div>
                        <div class="user-role">Floor Manager</div>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <div class="card flex flex-col" style="gap: 20px;">
                    <div class="flex justify-between align-center" style="border-bottom: 1px solid var(--border-color); padding-bottom:12px;">
                        <h4>Active Requests</h4>
                        <div style="font-size:12px; color:var(--text-muted);">
                            <i class="fa-solid fa-sync"></i> Re-fetches automatically across all devices
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Alert ID</th>
                                    <th>Table</th>
                                    <th>Request Type</th>
                                    <th>Time Submitted</th>
                                    <th>Current Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="requests-queue-rows">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/staff.js"></script>
    <script>
        const currentUser = checkAccess(['staff', 'admin']);

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) return;
            document.getElementById('navbar-username').innerText = currentUser.name;
            document.getElementById('avatar-circle').innerText = currentUser.name.charAt(0).toUpperCase();

            loadRequestsQueue();

            // Real-time synchronization
            window.addEventListener('db_updated', () => {
                loadRequestsQueue();
            });
        });

        function loadRequestsQueue() {
            const requests = dbGet('serviceRequests');
            const tbody = document.getElementById('requests-queue-rows');
            
            tbody.innerHTML = '';

            const activeRequests = requests.filter(r => r.status !== 'Completed');

            if (activeRequests.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding:20px;">
                            No active assistance requests in the queue.
                        </td>
                    </tr>
                `;
                return;
            }

            [...activeRequests].reverse().forEach(req => {
                let badgeClass = 'badge-warning';
                if (req.status === 'Accepted') badgeClass = 'badge-info';

                let actionBtns = '';
                if (req.status === 'Pending') {
                    actionBtns = `
                        <button class="btn btn-sm btn-primary" onclick="acceptRequestQueue('${req.requestId}')">Accept</button>
                        <button class="btn btn-sm btn-success" onclick="completeRequestQueue('${req.requestId}')">Done</button>
                    `;
                } else {
                    actionBtns = `
                        <button class="btn btn-sm btn-success" onclick="completeRequestQueue('${req.requestId}')">Mark Done</button>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${req.requestId}</strong></td>
                        <td>Table ${req.tableId}</td>
                        <td><strong>${req.type}</strong></td>
                        <td>${new Date(req.createdAt).toLocaleTimeString()}</td>
                        <td><span class="badge ${badgeClass}">${req.status}</span></td>
                        <td>
                            <div class="flex" style="gap:8px;">
                                ${actionBtns}
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function acceptRequestQueue(id) {
            const res = changeRequestStatus(id, 'Accepted');
            if (res.success) {
                showToast("Request accepted.", "info");
                loadRequestsQueue();
            }
        }

        function completeRequestQueue(id) {
            const res = changeRequestStatus(id, 'Completed');
            if (res.success) {
                showToast("Request resolved and archived.", "success");
                loadRequestsQueue();
            }
        }
    </script>
</body>
</html>
