<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Maa Hata Randha</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .staff-alert-card {
            background-color: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .staff-alert-card.water { border-left-color: #1e90ff; }
        .staff-alert-card.bill { border-left-color: #2ed573; }
        .staff-alert-card.assistance { border-left-color: #ffa502; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand">
                    <i class="fa-solid fa-utensils"></i>
                    Maa Hata<span>Randha</span>
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item active">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="orders.html" class="sidebar-link">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Manage Orders</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="tables.html" class="sidebar-link">
                        <i class="fa-solid fa-chair"></i>
                        <span>Floor Layout</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="requests.html" class="sidebar-link">
                        <i class="fa-solid fa-bell"></i>
                        <span>Assistance Calls</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="sidebar-link">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <h3>Staff Operations Dashboard</h3>
                <div class="user-profile">
                    <div class="user-avatar" id="avatar-circle">S</div>
                    <div class="user-info">
                        <div class="user-name" id="navbar-username">Loading...</div>
                        <div class="user-role">Floor Manager</div>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <!-- Stats widgets -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3 id="stat-pending-orders">0</h3>
                            <p>New Orders</p>
                        </div>
                        <div class="stat-card-icon primary"><i class="fa-solid fa-circle-exclamation"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3 id="stat-cooking-orders">0</h3>
                            <p>Active In Kitchen</p>
                        </div>
                        <div class="stat-card-icon info"><i class="fa-solid fa-fire-burner"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3 id="stat-today-bookings">0</h3>
                            <p>Today's Bookings</p>
                        </div>
                        <div class="stat-card-icon success"><i class="fa-solid fa-calendar-check"></i></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-info">
                            <h3 id="stat-pending-calls">0</h3>
                            <p>Assistance Requests</p>
                        </div>
                        <div class="stat-card-icon warning"><i class="fa-solid fa-bell"></i></div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <!-- Urgent Assistance calls -->
                    <div>
                        <div class="flex justify-between align-center" style="margin-bottom:12px;">
                            <h3>Urgent Customer Requests</h3>
                            <a href="requests.html" style="font-size:12px; font-weight:600;">View Queue <i class="fa-solid fa-angle-right"></i></a>
                        </div>
                        <div id="urgent-alerts-container">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Orders Quick summary list -->
                    <div>
                        <div class="flex justify-between align-center" style="margin-bottom:12px;">
                            <h3>Recent Orders</h3>
                            <a href="orders.html" style="font-size:12px; font-weight:600;">All Orders <i class="fa-solid fa-angle-right"></i></a>
                        </div>
                        <div class="card" id="quick-orders-log" style="padding: 20px;">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/staff.js"></script>
    <script>
        const currentUser = checkAccess(['staff', 'admin']);

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) return;
            document.getElementById('navbar-username').innerText = currentUser.name;
            document.getElementById('avatar-circle').innerText = currentUser.name.charAt(0).toUpperCase();

            loadStaffDashboard();

            // Real-time synchronization
            window.addEventListener('db_updated', () => {
                loadStaffDashboard();
            });
        });

        function loadStaffDashboard() {
            const orders = dbGet('orders');
            const reservations = dbGet('reservations');
            const requests = dbGet('serviceRequests');

            // 1. Calculate stats counts
            const pendingOrders = orders.filter(o => o.status === 'Placed').length;
            const cookingOrders = orders.filter(o => ['Accepted', 'Preparing', 'Ready'].includes(o.status)).length;
            
            const todayStr = new Date().toISOString().split('T')[0];
            const bookingsToday = reservations.filter(r => r.date === todayStr && r.status === 'Confirmed').length;
            
            const pendingCalls = requests.filter(r => r.status !== 'Completed').length;

            document.getElementById('stat-pending-orders').innerText = pendingOrders;
            document.getElementById('stat-cooking-orders').innerText = cookingOrders;
            document.getElementById('stat-today-bookings').innerText = bookingsToday;
            document.getElementById('stat-pending-calls').innerText = pendingCalls;

            // 2. Render Urgent Service Requests
            const urgentBox = document.getElementById('urgent-alerts-container');
            urgentBox.innerHTML = '';
            
            const pendingAlerts = requests.filter(r => r.status !== 'Completed');

            if (pendingAlerts.length === 0) {
                urgentBox.innerHTML = `
                    <div class="card" style="text-align: center; padding: 24px; color: var(--text-muted);">
                        <i class="fa-solid fa-bell-slash" style="font-size:24px; margin-bottom:8px;"></i>
                        <p style="font-size:13px;">No active assistance alerts from dining rooms.</p>
                    </div>
                `;
            } else {
                pendingAlerts.slice(0, 4).forEach(req => {
                    let borderClass = '';
                    if (req.type === 'Request Water') borderClass = 'water';
                    else if (req.type === 'Request Bill') borderClass = 'bill';
                    else if (req.type === 'Need Assistance') borderClass = 'assistance';

                    let actButton = `
                        <button class="btn btn-sm btn-primary" onclick="acceptAlert('${req.requestId}')">Accept</button>
                    `;
                    if (req.status === 'Accepted') {
                        actButton = `
                            <button class="btn btn-sm btn-success" onclick="resolveAlert('${req.requestId}')">Done</button>
                        `;
                    }

                    urgentBox.innerHTML += `
                        <div class="staff-alert-card ${borderClass}">
                            <div>
                                <h4 style="font-size:14px; color:var(--secondary);">${req.type}</h4>
                                <p style="font-size:12px; color:var(--text-muted);">Table ${req.tableId} &bull; ${req.status}</p>
                            </div>
                            <div>
                                ${actButton}
                            </div>
                        </div>
                    `;
                });
            }

            // 3. Render Quick Orders Log
            const ordersBox = document.getElementById('quick-orders-log');
            ordersBox.innerHTML = '';

            const recentOrders = orders.filter(o => o.status !== 'Served' && o.status !== 'Cancelled');
            if (recentOrders.length === 0) {
                ordersBox.innerHTML = `<p style="color:var(--text-muted); font-size:13px;">No active kitchen orders.</p>`;
            } else {
                [...recentOrders].reverse().slice(0, 4).forEach(o => {
                    ordersBox.innerHTML += `
                        <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px; font-size:13px;">
                            <div class="flex justify-between">
                                <strong>ID: ${o.orderId}</strong>
                                <span class="badge ${o.status === 'Placed' ? 'badge-warning' : 'badge-info'}">${o.status}</span>
                            </div>
                            <p style="color:var(--text-muted); font-size:11px; margin-top:2px;">
                                ${o.orderType} ${o.tableId ? `&bull; Table ` + o.tableId : ''} &bull; Total: ₹${o.total}
                            </p>
                        </div>
                    `;
                });
            }
        }

        function acceptAlert(id) {
            const res = changeRequestStatus(id, 'Accepted');
            if (res.success) {
                showToast("Request marked as Accepted.", "info");
                loadStaffDashboard();
            }
        }

        function resolveAlert(id) {
            const res = changeRequestStatus(id, 'Completed');
            if (res.success) {
                showToast("Request marked as Completed.", "success");
                loadStaffDashboard();
            }
        }
    </script>
</body>
</html>
