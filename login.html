<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Maa Hata Randha</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.05) 0%, rgba(47, 53, 66, 0.05) 100%), var(--bg-main);
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            padding: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .logo {
            justify-content: center;
            margin-bottom: 15px;
        }
        .demo-credentials-box {
            background-color: #fafbfe;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .demo-credential-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }
        .demo-credential-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .demo-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-utensils"></i>
                    Maa Hata<span>Randha</span>
                </a>
                <h2 style="margin-top: 10px;">Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Sign in to manage bookings & orders</p>
            </div>

            <div class="demo-credentials-box">
                <p style="font-weight: 600; margin-bottom: 10px; color: var(--secondary);">
                    <i class="fa-solid fa-circle-info" style="color: var(--info);"></i> Quick Demo Login:
                </p>
                <div class="demo-credential-row">
                    <span><strong>Admin:</strong> admin@restaurant.com</span>
                    <button type="button" class="demo-btn" onclick="fillCreds('admin@restaurant.com', 'admin123')">Fill</button>
                </div>
                <div class="demo-credential-row">
                    <span><strong>Staff:</strong> staff@restaurant.com</span>
                    <button type="button" class="demo-btn" onclick="fillCreds('staff@restaurant.com', 'staff123')">Fill</button>
                </div>
                <div class="demo-credential-row">
                    <span><strong>Customer:</strong> customer@restaurant.com</span>
                    <button type="button" class="demo-btn" onclick="fillCreds('customer@restaurant.com', 'customer123')">Fill</button>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign In</button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="font-weight: 600;">Register Here</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillCreds(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
