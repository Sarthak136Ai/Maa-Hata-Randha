<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Maa Hata Randha</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-brand">
                    <i class="fa-solid fa-utensils"></i>
                    Maa Hata<span>Randha</span>
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-gauge"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="menu.html" class="sidebar-link">
                        <i class="fa-solid fa-circle-nodes"></i>
                        <span>Digital Menu</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="reservation.html" class="sidebar-link">
                        <i class="fa-solid fa-chair"></i>
                        <span>Book Table</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="cart.html" class="sidebar-link">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Active Cart</span>
                        <span id="sidebar-cart-badge" class="badge badge-danger" style="margin-left: auto; display: none;">0</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="orders.html" class="sidebar-link">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Track Orders</span>
                    </a>
                </li>
                <li class="sidebar-item active">
                    <a href="profile.html" class="sidebar-link">
                        <i class="fa-solid fa-user-gear"></i>
                        <span>My Profile</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="sidebar-link">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <h3>Account Settings</h3>
                <div class="user-profile">
                    <div class="user-avatar" id="avatar-circle">U</div>
                    <div class="user-info">
                        <div class="user-name" id="navbar-username">Loading...</div>
                        <div class="user-role">Premium Guest</div>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="card flex flex-col" style="gap: 20px;">
                        <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 8px;">
                            Personal Details
                        </h4>
                        
                        <form id="profile-form" onsubmit="updateProfile(event)">
                            <div class="form-group">
                                <label class="form-label" for="profile-name">Full Name</label>
                                <input type="text" id="profile-name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="profile-email">Email Address</label>
                                <input type="email" id="profile-email" class="form-control" readonly style="background-color:#f1f2f6; cursor:not-allowed;">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="profile-pass">Change Password</label>
                                <input type="password" id="profile-pass" class="form-control" placeholder="Enter new password to change">
                            </div>
                            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
                                Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script>
        const currentUser = checkAccess(['customer']);

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) return;
            document.getElementById('navbar-username').innerText = currentUser.name;
            document.getElementById('avatar-circle').innerText = currentUser.name.charAt(0).toUpperCase();

            // Populate form fields
            document.getElementById('profile-name').value = currentUser.name;
            document.getElementById('profile-email').value = currentUser.email;

            updateCartBadge();
        });

        function updateProfile(e) {
            e.preventDefault();
            const nameVal = document.getElementById('profile-name').value.trim();
            const passVal = document.getElementById('profile-pass').value;

            if (!nameVal) {
                showToast("Name cannot be empty.", "error");
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const userIdx = users.findIndex(u => u.id === currentUser.id);

            if (userIdx !== -1) {
                users[userIdx].name = nameVal;
                currentUser.name = nameVal;
                
                if (passVal) {
                    users[userIdx].password = passVal;
                    showToast("Profile details and password updated!", "success");
                } else {
                    showToast("Profile details updated successfully.", "success");
                }

                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                // Update header values
                document.getElementById('navbar-username').innerText = nameVal;
                document.getElementById('avatar-circle').innerText = nameVal.charAt(0).toUpperCase();
                document.getElementById('profile-pass').value = '';
            } else {
                showToast("Failed to update profile.", "error");
            }
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart_' + currentUser.id)) || [];
            const badge = document.getElementById('sidebar-cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }
    </script>
</body>
</html>
